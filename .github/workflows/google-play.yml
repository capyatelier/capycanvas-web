name: Publish Google Play listing
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate uploads or commit the listing for Google review
        type: choice
        options: [validate, publish]
        default: validate
permissions:
  contents: read
concurrency:
  group: google-play-listing
  cancel-in-progress: false
jobs:
  listing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test tests/google-play.test.mjs
      - run: node site/scripts/store/google-play.mjs check
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload and validate listing
        env:
          GOOGLE_PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
          MODE: ${{ inputs.mode }}
        run: node site/scripts/store/google-play.mjs "$MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: google-play-publish
          path: artifacts/google-play-publish/
